<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Tuckman team development model</title><desc id="desc">Teams move through forming, storming, norming, performing, and adjourning, with a different leadership focus at each stage.</desc>
  <rect width="1200" height="650" rx="32" fill="#f8fafc"/><text x="600" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#172033">Tuckman’s Team Development Model</text><text x="600" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#596579">Growth is not linear; each stage calls for a different leadership focus</text>
  <path d="M105 505 C190 505 190 400 275 400 S360 470 445 360 S535 280 615 280 S705 165 785 165 S875 230 955 230 S1030 290 1095 290" fill="none" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round"/>
  <g font-family="system-ui, sans-serif">
    <g transform="translate(55 420)"><rect width="205" height="145" rx="20" fill="#e8f1ff" stroke="#7aa8f7" stroke-width="2"/><circle cx="32" cy="34" r="16" fill="#377bd6"/><text x="60" y="42" font-size="25" font-weight="700" fill="#2457a6">Forming</text><text x="20" y="81" font-size="18" fill="#172033">Clarify direction</text><text x="20" y="110" font-size="18" fill="#172033">and boundaries</text></g>
    <g transform="translate(275 375)"><rect width="205" height="145" rx="20" fill="#fff1e5" stroke="#ee9a4c" stroke-width="2"/><circle cx="32" cy="34" r="16" fill="#e98228"/><text x="60" y="42" font-size="25" font-weight="700" fill="#9b4d0c">Storming</text><text x="20" y="81" font-size="18" fill="#172033">Surface conflict</text><text x="20" y="110" font-size="18" fill="#172033">and set rules</text></g>
    <g transform="translate(495 270)"><rect width="205" height="145" rx="20" fill="#f8f0dc" stroke="#d5aa3f" stroke-width="2"/><circle cx="32" cy="34" r="16" fill="#c99617"/><text x="60" y="42" font-size="25" font-weight="700" fill="#7d5a06">Norming</text><text x="20" y="81" font-size="18" fill="#172033">Build trust and</text><text x="20" y="110" font-size="18" fill="#172033">delegate gradually</text></g>
    <g transform="translate(715 125)"><rect width="205" height="145" rx="20" fill="#e8f8f1" stroke="#63bf91" stroke-width="2"/><circle cx="32" cy="34" r="16" fill="#2d9b68"/><text x="60" y="42" font-size="25" font-weight="700" fill="#18714a">Performing</text><text x="20" y="81" font-size="18" fill="#172033">Align on goals</text><text x="20" y="110" font-size="18" fill="#172033">and risks</text></g>
    <g transform="translate(935 245)"><rect width="205" height="145" rx="20" fill="#f1ecfb" stroke="#9c7bd4" stroke-width="2"/><circle cx="32" cy="34" r="16" fill="#8060b8"/><text x="60" y="42" font-size="25" font-weight="700" fill="#66439f">Adjourning</text><text x="20" y="81" font-size="18" fill="#172033">Reflect and honor</text><text x="20" y="110" font-size="18" fill="#172033">contributions</text></g>
  </g><text x="600" y="615" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#596579">Time and shared experience →</text>
</svg>
