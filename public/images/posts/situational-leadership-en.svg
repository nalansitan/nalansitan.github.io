<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Situational Leadership quadrants</title>
  <desc id="desc">Four leadership styles organized by directive and supportive behavior.</desc>
  <rect width="1200" height="760" rx="32" fill="#f8fafc"/>
  <text x="600" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#172033">Situational Leadership: Match Support to the Task</text>
  <text x="600" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#596579">Assess readiness for this specific task—not a permanent label on the person</text>
  <g transform="translate(170 138)" font-family="system-ui, sans-serif">
    <rect width="430" height="245" rx="20" fill="#e8f1ff" stroke="#7aa8f7" stroke-width="2"/><text x="28" y="46" font-size="27" font-weight="700" fill="#2457a6">Coaching</text><text x="28" y="82" font-size="18" fill="#34445e">Lower capability · Falling confidence</text><text x="28" y="125" font-size="20" fill="#172033">Teach the method and give feedback</text><text x="28" y="158" font-size="20" fill="#172033">Provide direction and encouragement</text><rect x="245" y="187" width="157" height="36" rx="18" fill="#cddfff"/><text x="323" y="211" text-anchor="middle" font-size="16" font-weight="650" fill="#2457a6">High direction · support</text>
    <rect x="450" width="430" height="245" rx="20" fill="#e8f8f1" stroke="#63bf91" stroke-width="2"/><text x="478" y="46" font-size="27" font-weight="700" fill="#18714a">Supporting</text><text x="478" y="82" font-size="18" fill="#34445e">Higher capability · Variable confidence</text><text x="478" y="125" font-size="20" fill="#172033">Listen more; give fewer answers</text><text x="478" y="158" font-size="20" fill="#172033">Build confidence and autonomy</text><rect x="695" y="187" width="157" height="36" rx="18" fill="#ccebdd"/><text x="773" y="211" text-anchor="middle" font-size="16" font-weight="650" fill="#18714a">Low direction · high support</text>
    <rect y="265" width="430" height="245" rx="20" fill="#fff1e5" stroke="#ee9a4c" stroke-width="2"/><text x="28" y="311" font-size="27" font-weight="700" fill="#9b4d0c">Directing</text><text x="28" y="347" font-size="18" fill="#34445e">Lower capability · High commitment</text><text x="28" y="390" font-size="20" fill="#172033">Clarify goals, boundaries, and steps</text><text x="28" y="423" font-size="20" fill="#172033">Establish a method for the task</text><rect x="245" y="452" width="157" height="36" rx="18" fill="#ffddbe"/><text x="323" y="476" text-anchor="middle" font-size="16" font-weight="650" fill="#9b4d0c">High direction · low support</text>
    <rect x="450" y="265" width="430" height="245" rx="20" fill="#f1ecfb" stroke="#9c7bd4" stroke-width="2"/><text x="478" y="311" font-size="27" font-weight="700" fill="#66439f">Delegating</text><text x="478" y="347" font-size="18" fill="#34445e">High capability · Steady commitment</text><text x="478" y="390" font-size="20" fill="#172033">Align on goals, risks, and checkpoints</text><text x="478" y="423" font-size="20" fill="#172033">Return decision space to the owner</text><rect x="695" y="452" width="157" height="36" rx="18" fill="#ddd1f1"/><text x="773" y="476" text-anchor="middle" font-size="16" font-weight="650" fill="#66439f">Low direction · support</text>
  </g>
  <path d="M140 676h930" stroke="#46556d" stroke-width="3" marker-end="url(#arrow)"/><path d="M115 650V150" stroke="#46556d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="605" y="714" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#34445e">Directive behavior: high ←　　　　　　　　　　　　　　　→ low</text><text x="55" y="405" text-anchor="middle" transform="rotate(-90 55 405)" font-family="system-ui, sans-serif" font-size="19" fill="#34445e">Supportive behavior: low → high</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#46556d"/></marker></defs>
</svg>
