<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Tuckman 团队发展模型</title><desc id="desc">团队依次经历组建、风暴、规范、高效和休整五个阶段，每个阶段需要不同的领导关注点。</desc>
  <rect width="1200" height="650" rx="32" fill="#f8fafc"/>
  <text x="600" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#172033">Tuckman 团队发展模型</text>
  <text x="600" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#596579">团队成长不是直线上升，每个阶段需要不同的领导关注点</text>
  <path d="M105 505 C190 505 190 400 275 400 S360 470 445 360 S535 280 615 280 S705 165 785 165 S875 230 955 230 S1030 290 1095 290" fill="none" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round"/>
  <g font-family="system-ui, sans-serif">
    <g transform="translate(55 420)"><rect width="205" height="145" rx="20" fill="#e8f1ff" stroke="#7aa8f7" stroke-width="2"/><circle cx="32" cy="34" r="16" fill="#377bd6"/><text x="60" y="42" font-size="25" font-weight="700" fill="#2457a6">组建期</text><text x="20" y="76" font-size="17" fill="#34445e">Forming</text><text x="20" y="109" font-size="18" fill="#172033">明确方向与边界</text></g>
    <g transform="translate(275 375)"><rect width="205" height="145" rx="20" fill="#fff1e5" stroke="#ee9a4c" stroke-width="2"/><circle cx="32" cy="34" r="16" fill="#e98228"/><text x="60" y="42" font-size="25" font-weight="700" fill="#9b4d0c">风暴期</text><text x="20" y="76" font-size="17" fill="#34445e">Storming</text><text x="20" y="109" font-size="18" fill="#172033">让冲突浮出水面</text></g>
    <g transform="translate(495 270)"><rect width="205" height="145" rx="20" fill="#f8f0dc" stroke="#d5aa3f" stroke-width="2"/><circle cx="32" cy="34" r="16" fill="#c99617"/><text x="60" y="42" font-size="25" font-weight="700" fill="#7d5a06">规范期</text><text x="20" y="76" font-size="17" fill="#34445e">Norming</text><text x="20" y="109" font-size="18" fill="#172033">建立信任并授权</text></g>
    <g transform="translate(715 125)"><rect width="205" height="145" rx="20" fill="#e8f8f1" stroke="#63bf91" stroke-width="2"/><circle cx="32" cy="34" r="16" fill="#2d9b68"/><text x="60" y="42" font-size="25" font-weight="700" fill="#18714a">高效期</text><text x="20" y="76" font-size="17" fill="#34445e">Performing</text><text x="20" y="109" font-size="18" fill="#172033">对齐目标与风险</text></g>
    <g transform="translate(935 245)"><rect width="205" height="145" rx="20" fill="#f1ecfb" stroke="#9c7bd4" stroke-width="2"/><circle cx="32" cy="34" r="16" fill="#8060b8"/><text x="60" y="42" font-size="25" font-weight="700" fill="#66439f">休整期</text><text x="20" y="76" font-size="17" fill="#34445e">Adjourning</text><text x="20" y="109" font-size="18" fill="#172033">复盘并认可贡献</text></g>
  </g>
  <text x="600" y="615" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#596579">时间与共同经历 →</text>
</svg>
